<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Divya Dharshini</title>

  <!-- GOOGLE FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- ICONS -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter', sans-serif;
    }

    body{
      background:#020617;
      color:white;
      overflow-x:hidden;
    }

    /* NAVBAR */

    nav{
      width:100%;
      padding:24px 8%;

      display:flex;
      justify-content:space-between;
      align-items:center;

      position:fixed;
      top:0;
      z-index:1000;

      backdrop-filter:blur(14px);

      background:rgba(2,6,23,0.55);

      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .logo{
      font-size:24px;
      font-weight:700;
      letter-spacing:1px;
    }

    .logo span{
      color:#38bdf8;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:32px;
    }

    .nav-links a{
      text-decoration:none;
      color:white;
      font-size:15px;
      font-weight:500;
      transition:0.3s;
      position:relative;
    }

    .nav-links a::after{
      content:'';
      position:absolute;
      left:0;
      bottom:-6px;

      width:0%;
      height:2px;

      background:#38bdf8;

      transition:0.3s;
    }

    .nav-links a:hover{
      color:#38bdf8;
    }

    .nav-links a:hover::after{
      width:100%;
    }

    /* BACKGROUND */

    .background{
      position:fixed;
      width:100%;
      height:100%;
      top:0;
      left:0;
      z-index:-1;

      background:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

      background-size:50px 50px;
    }

    .blur1{
      position:absolute;

      width:450px;
      height:450px;

      background:#0ea5e9;

      opacity:0.14;

      border-radius:50%;

      filter:blur(120px);

      top:-100px;
      left:-100px;
    }

    .blur2{
      position:absolute;

      width:400px;
      height:400px;

      background:#2563eb;

      opacity:0.12;

      border-radius:50%;

      filter:blur(120px);

      bottom:-100px;
      right:-100px;
    }

    /* CONTACT SECTION */

    .contact-section{
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:140px 40px 40px;
    }

    .contact-card{

      width:100%;
      max-width:750px;

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border-radius:28px;

      padding:60px;

      text-align:center;
    }

    .contact-card h1{

      font-size:54px;
      margin-bottom:18px;
      font-weight:700;
    }

    .contact-card h1 span{
      color:#38bdf8;
    }

    .contact-card p{

      color:#94a3b8;
      font-size:17px;
      line-height:1.8;

      margin-bottom:45px;
    }

    /* INFO */

    .contact-info{

      display:flex;
      flex-direction:column;
      gap:22px;

      margin-bottom:45px;
    }

    .info-box{

      background:rgba(255,255,255,0.04);

      border:1px solid rgba(255,255,255,0.06);

      border-radius:18px;

      padding:20px;

      display:flex;
      align-items:center;
      gap:18px;

      transition:0.3s;
    }

    .info-box:hover{

      transform:translateY(-4px);

      border-color:rgba(56,189,248,0.4);
    }

    .info-box i{

      width:52px;
      height:52px;

      display:flex;
      justify-content:center;
      align-items:center;

      background:#38bdf8;

      color:#020617;

      border-radius:14px;

      font-size:20px;
    }

    .info-text{
      text-align:left;
    }

    .info-text h3{

      font-size:16px;
      margin-bottom:5px;
      font-weight:600;
    }

    .info-text p{

      margin:0;
      color:#94a3b8;
      font-size:15px;
    }

    /* SOCIAL ICONS */

    .social-icons{

      display:flex;
      justify-content:center;
      gap:18px;
    }

    .social-icons a{

      width:54px;
      height:54px;

      display:flex;
      justify-content:center;
      align-items:center;

      text-decoration:none;

      color:white;

      font-size:20px;

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.08);

      border-radius:16px;

      transition:0.3s;
    }

    .social-icons a:hover{

      background:#38bdf8;
      color:#020617;

      transform:translateY(-5px);
    }

    /* RESPONSIVE */

    @media(max-width:900px){

      nav{
        flex-direction:column;
        gap:18px;
      }

      .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:18px;
      }
    }

    @media(max-width:700px){

      .contact-card{
        padding:35px 25px;
      }

      .contact-card h1{
        font-size:40px;
      }

      .info-box{
        flex-direction:column;
        text-align:center;
      }

      .info-text{
        text-align:center;
      }
    }

  </style>

</head>
